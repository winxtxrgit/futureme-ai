<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Recommendation decision matrix: interests 30 percent, feasibility 25 percent, strengths 20 percent, learning style 15 percent, future flexibility 10 percent">
  <defs>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EF6"/>
      <stop offset="48%" stop-color="#C13BF0"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D5EF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6D5EF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="barClip"><rect x="80" y="112" width="1040" height="46" rx="10"/></clipPath>
    <clipPath id="cardClip"><rect x="0" y="0" width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="300" fill="#0B0B14"/>
    <ellipse cx="140" cy="20" rx="420" ry="220" fill="url(#g2)"/>

    <text x="80" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F5F5FA">Recommendation decision matrix</text>
    <text x="80" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A0A0B8">Five criteria, each scored 0–100, combined into one weighted composite score</text>

    <g clip-path="url(#barClip)">
      <rect x="80"   y="112" width="312" height="46" fill="#6D5EF6"/>
      <rect x="392"  y="112" width="260" height="46" fill="#6D5EF6" fill-opacity="0.80"/>
      <rect x="652"  y="112" width="208" height="46" fill="#6D5EF6" fill-opacity="0.60"/>
      <rect x="860"  y="112" width="156" height="46" fill="#6D5EF6" fill-opacity="0.42"/>
      <rect x="1016" y="112" width="104" height="46" fill="#6D5EF6" fill-opacity="0.26"/>
      <g stroke="#0B0B14" stroke-width="2">
        <line x1="392" y1="112" x2="392" y2="158"/>
        <line x1="652" y1="112" x2="652" y2="158"/>
        <line x1="860" y1="112" x2="860" y2="158"/>
        <line x1="1016" y1="112" x2="1016" y2="158"/>
      </g>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F5FA" text-anchor="middle">
      <text x="236" y="142">30%</text>
      <text x="522" y="142">25%</text>
      <text x="756" y="142">20%</text>
      <text x="938" y="142">15%</text>
      <text x="1068" y="142" fill="#D8D4E5">10%</text>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <g transform="translate(80,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Interests</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">RIASEC profile</text>
      </g>
      <g transform="translate(288,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6" fill-opacity="0.80"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Feasibility</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">Cost, location, timing</text>
      </g>
      <g transform="translate(496,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6" fill-opacity="0.60"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Strengths</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">Mission rule signals</text>
      </g>
      <g transform="translate(704,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6" fill-opacity="0.42"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Learning style</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">How they prefer to work</text>
      </g>
      <g transform="translate(912,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6" fill-opacity="0.26"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Future flexibility</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">Options kept open</text>
      </g>
    </g>

    <text x="80" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B879E">Fixed in lib/decision-engine/scoring.ts · design judgement · not fitted to student outcomes</text>
    <rect x="0" y="296" width="1200" height="4" fill="url(#aurora2)"/>
  </g>
</svg>
