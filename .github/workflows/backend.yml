name: Backend

on:
  push:
    branches: [main]
    paths:
      - "02_Backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "02_Backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02_Backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
